# LeadTestKit configuration for Open vSwitch.
#
# Copy this file to config.yaml on the `state` branch of your bot
# repository.  Secrets are not configured here; see SETUP.rst.
# Every option is explained in reference.yaml.

enabled: true
name: Open vSwitch

patchwork:
  api_url: https://patchwork.ozlabs.org/api/1.2
  project: openvswitch
  min_delay: 5s

upstream:
  git_url: https://github.com/openvswitch/ovs.git
  default_branch: main

test_repo:
  repo: ovsrobot/ovs

report:
  style: ovs
  to: ovs-build@openvswitch.org
  from: "LeadTestKit Robot <robot@example.org>"
  label: github-robot
  apply_label: apply-robot
  cc_submitter: true
  pending: check

archive:
  reports_url: https://mail.openvswitch.org/pipermail/ovs-build/
  dev_url: https://mail.openvswitch.org/pipermail/ovs-dev/
  ingest: true

smtp:
  host: smtp.example.org
  port: 587
  security: starttls

# Start in test mode: checks are only logged, emails are marked so that
# other bots ignore them and only go to allowed_recipients.
mode:
  push: live
  checks: log
  email: test
  allowed_recipients:
    - ovs-build@openvswitch.org

rules:
  skip:
    - subject: '^\[[^\]]*\bRFC\b[^\]]*\]'
      reason: RFC
    # Kernel patches cross-posted to the list, e.g. [ovs-dev,net,v2], or
    # recognized by the kernel paths they change, which OVS does not have.
    - subject: '^\[[^\]]*\bnet(-next)?\b[^\]]*\]'
      reason: kernel patch
    - files: '^(net|include/uapi/linux|tools/testing/selftests)/'
      reason: kernel patch
  base:
    - type: subject
      match: '^\[[^\]]*\b(branch-\d+\.\d+)\b[^\]]*\]'
      branch: '$1'
    - type: subject
      match: '^\[[^\]]*\b(dpdk-latest)\b[^\]]*\]'
      branch: '$1'
  supersede: true

limits:
  max_queued_jobs: 20
  max_inflight_patches: 10
  per_author_min: 2
  per_author_max_share: 0.5
  jobs_per_patch: 20

workflows:
  # The push workflows of OVS.  A patch waits for both, and one that did
  # not start is reported as a warning.  Every base branch selected
  # above needs them, which is the case for branch-3.3 and later.
  expected:
    - Build and Test
    - FreeBSD Build and Test

  # Uncomment after adding workflows to the test repository's main
  # branch for the bot to dispatch for every patch, e.g.
  # fork-workflows/leadtest-checkpatch-ovs.yml (see SETUP.rst, step 1).
  # Do not list them in expected: the bot waits for its own dispatches.
  # custom: true

rechecks:
  enabled: true
  labels: [github-robot]

pages:
  enabled: true
  title: Open vSwitch CI
  list_tag: ovs-dev

alerts:
  # Maintainers to email when something the bot needs stops working.
  to: []
